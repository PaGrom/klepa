name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # The processing extra brings Pillow, which Core's renderer of a document's pages needs (stage 2c-1).
      - name: Install dependencies
        run: uv sync --locked --extra processing
      - name: Lint
        run: uv run ruff check
      - name: Formatting
        run: uv run ruff format --check
      - name: Types
        run: uv run mypy

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the target platform (F_FULLFSYNC, launchd); Linux keeps the core portable.
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # The adapter's contract test runs the plugin under Node, against Core's adapter server.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: uv sync --locked --extra processing
      - name: Run tests
        run: uv run pytest

  adapter:
    name: Adapter plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/adapter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/adapter/package-lock.json
      - name: Install the type checker
        run: npm ci --ignore-scripts
      - name: Types
        run: npx tsc -p tsconfig.json
      - name: Tests
        run: node --test adapter.test.ts mcp.test.ts
