# Example installation config. Copy it OUTSIDE this repository and fill in real values there.
# Real tokens, names and Telegram IDs never go into the repository.
timezone = "Europe/Berlin"
locale = "ru"      # en, ru, sr or uk: what Core says, the shared folder name, private keywords

[paths]
data_dir = "/Users/you/KlepaData"                # 0700, local disk, not iCloud/CloudStorage
documents_dir = "/Users/you/KlepaDocuments"      # any folder; Core does not care what, if anything, syncs it

[telegram]
token_file = "/Users/you/KlepaData/keys/family-bot.token"   # 0600, typed via stdin, never pasted in chat
api_root = "https://api.telegram.org"

[spaces]
default = "shared"
# shared_folder = "Family"   # default: the name the locale gives to the shared folder

[intake]
batch_window_seconds = 2.0
poll_timeout_seconds = 30
album_quiet_seconds = 60   # album items are copied only after the album has been quiet this long

[[members]]
person_id = "owner"
telegram_id = 100000001
name = "Owner"
role = "owner"

[[members]]
person_id = "partner"
telegram_id = 100000002
name = "Partner"
role = "member"

[schedule]
snapshot_at = "03:30"      # local time; "off" disables
daily_line_at = "09:00"    # the service bot's daily line; "off" disables

# The service bot: alerts, the daily line and a Status button, for the owner only.
[service_bot]
token_file = "/Users/you/KlepaData/keys/service-bot.token"   # 0600, typed via stdin, not the family bot's

# The agent host behind the gatekeeper (optional). Without this section Core answers text itself.
# [host]
# api_port = 19201                         # the host's API root: http://127.0.0.1:19201
# proxy_port = 19202                       # the host's proxy for all its HTTP
# egress_allow = ["api.anthropic.com:443"] # exact names and ports; no masks, no addresses; the model needs this one
# gateway = "launchd"                      # Core runs its own OpenClaw gateway; install it with: host install
# gateway_port = 19300                     # well away from another OpenClaw's ports (18789 and up by default)
# model = "anthropic/claude-sonnet-5"      # the one model the gateway may use

# Attachments read in a sandbox (optional, macOS). Without this section nothing is read: search knows a record by its
# name and caption. The programs come from Homebrew and macOS; ocrmypdf from the engine's `processing` extra.
# [processing]
# whisper_model = "/Users/you/.cache/whisper/ggml-large-v3-turbo-q8_0.bin"   # without it, voice messages wait unread
# tessdata = "/Users/you/Library/Application Support/Klepa/tessdata"         # <language>.traineddata, configs linked in
# ocr_languages = "rus+eng"                                                  # default: by the locale; more is slower
