[project]
name = "klepa-engine"
version = "0.1.0"
description = "Family second-brain engine for agent hosts: a Telegram gatekeeper that stores documents durably and keeps personal spaces private."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = ["aiohttp>=3.10"]

[project.urls]
Homepage = "https://github.com/PaGrom/klepa"
Issues = "https://github.com/PaGrom/klepa/issues"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/klepa_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["core", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["klepa_core", "helpers", "faketg"]

[tool.ruff.lint.per-file-ignores]
# Letters that look Latin but are Cyrillic are the point of this module.
"tests/test_languages.py" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
# Core targets macOS (F_FULLFSYNC, launchd); check it as macOS wherever mypy runs.
platform = "darwin"
strict = true
mypy_path = "core"
files = ["core/klepa_core"]
