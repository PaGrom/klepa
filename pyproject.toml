[project]
name = "klepa-engine"
version = "0.1.0"
description = "Family memory engine for agent hosts. Stage 1a: Core receives files from Telegram."
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.10"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/klepa_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
