# Ukrainian: everything Core says itself, the default shared folder name and private caption keywords.
plural = "one-few-many"

[texts]
stage1 = "Поки що я лише приймаю файли: документи, фото та голосові."
start = "Привіт! Поки що я лише приймаю файли: документи, фото та голосові."
no_commands = "Команд у мене немає — пиши словами."
unsupported = "Таке я поки що не зберігаю. Надішли, будь ласка, файл, фото або голосове."
too_large = "Цей файл більший за 20 МБ, а такі Telegram ботам не віддає. Надішли його, будь ласка, інакше: частинами або стиснутим."
failed = "Не змогла забрати цей файл із Telegram. Надішли його, будь ласка, ще раз."

[receipts]
one_file = "📄 отримала"
one_voice = "🎧 отримала голосове"
voices = "🎧 отримала голосові: {n}"
files = { one = "📄 отримала {n} файл", few = "📄 отримала {n} файли", many = "📄 отримала {n} файлів" }

[spaces]
shared_folder = "Спільне"
private_keywords = ["тільки для мене", "лише для мене", "тільки мені", "особисто", "особисте", "особистий", "особиста",
                    "особисті", "особистих", "just for me", "private"]

[service]
status_button = "Статус"
not_yet = "Механік з'явиться пізніше. Поки що я надсилаю тривоги й щоденний рядок, а кнопка «Статус» показує, як справи."
button_expired = "Ця кнопка вже не діє."
all_good = "✅ Усе гаразд"
attention = "⚠️ Потрібна увага"
line = "{headline} · прийом: {last_intake} · знімок: {snapshot} · тека документів: {documents} · чекають копіювання: {pending_copies} · конфліктів копіювання: {failed_copies} · непідтверджених надсилань за 48 год: {unknown_sends}"
snapshot = "№{generation} {hash} ({integrity})"
never = "ще не було"
no_snapshot = "ще немає"
ok = "гаразд"
unavailable = "недоступна ({error})"
alert_documents_unavailable = "⚠️ Тека документів недоступна ({error}). Файли й далі приймаються й будуть скопійовані, коли вона повернеться."
alert_permission_denied = "⚠️ macOS не пускає ядро до теки документів ({error}). Дозволь {interpreter} у «Системні параметри → Приватність і безпека → Повний доступ до диска» або підтвердь запит macOS. Потім перезапусти ядро."
alert_channel_dead = "⚠️ Telegram не віддає оновлення сімейного бота ({error}). Повідомлення Telegram зберігає 24 години."
alert_snapshot_failed = "⚠️ Щоденний знімок не вдався ({error})."
alert_restarted = "⚠️ Ядро перезапустилося після неочікуваної зупинки."
alert_album_private_after_copy = "⚠️ Альбом став особистим уже після копіювання до спільної теки. Скопійовано файлів: {count}. Перенеси їх вручну."
