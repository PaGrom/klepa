# English: everything Core says itself, the default shared folder name and private caption keywords.
plural = "one-other"

[texts]
stage1 = "For now I only accept files: documents, photos and voice messages."
start = "Hi! For now I only accept files: documents, photos and voice messages."
no_commands = "I have no commands. Just write to me in words."
unsupported = "I can't save this yet. Please send a file, a photo or a voice message."
too_large = "This file is larger than 20 MB, and Telegram does not give such files to bots. Please send it another way: in parts or compressed."
failed = "I couldn't get this file from Telegram. Please send it again."
hold = "I'm under maintenance right now. I saved your message and will answer later."
held_dropped = "I couldn't answer in time. Please send your message again."
turn_failed = "I couldn't answer just now: something broke on my side, and the owner knows. Please ask again a bit later."
original_failed = "I couldn't send the file {name}. Please ask me again a bit later."

[receipts]
one_file = "📄 got it"
one_voice = "🎧 got the voice message"
voices = "🎧 got {n} voice messages"
files = { one = "📄 got {n} file", other = "📄 got {n} files" }

[spaces]
shared_folder = "Shared"
private_keywords = ["just for me", "only for me", "private", "personal"]

[service]
status_button = "Status"
pause_button = "Pause"
resume_button = "Resume"
not_yet = "The mechanic arrives in a later stage. For now I send alerts and the daily line, and the Status button shows how things are."
button_expired = "This button no longer works."
all_good = "✅ All good"
attention = "⚠️ Needs attention"
line = "{headline} · host: {host} · last intake: {last_intake} · snapshot: {snapshot} · documents folder: {documents} · waiting to copy: {pending_copies} · copy conflicts: {failed_copies} · unconfirmed sends in 48 h: {unknown_sends}"
snapshot = "#{generation} {hash} ({integrity})"
never = "none yet"
no_snapshot = "none yet"
ok = "ok"
unavailable = "unavailable ({error})"
host_off = "not connected"
host_starting = "starting"
host_running = "running"
host_hold = "on hold: the adapter is silent"
host_paused = "paused"
host_stopped = "stopped"
alert_documents_unavailable = "⚠️ The documents folder is not available ({error}). Files are still received and will be copied when it is back."
alert_documents_timeout = "⚠️ The documents folder does not answer ({error}). macOS may be waiting for you to allow {interpreter}: look for a prompt on the Mac. Files are still received and will be copied when the folder answers."
alert_permission_denied = "⚠️ macOS denies Core access to the documents folder ({error}). Allow {interpreter} in System Settings → Privacy & Security → Full Disk Access, or accept the macOS prompt. Then restart Core."
alert_channel_dead = "⚠️ Telegram refuses the family bot's polling ({error}). Telegram keeps messages for 24 hours."
alert_snapshot_failed = "⚠️ The daily snapshot failed ({error})."
alert_restarted = "⚠️ Core restarted after an unexpected stop."
alert_album_private_after_copy = "⚠️ An album became private after some of its files had been copied to the shared folder. Copied files: {count}. Please move them by hand."
alert_host_failed = "⚠️ The host did not pass its check ({reason}). It gets no messages; people get a fixed reply, and their messages wait."
alert_host_silent = "⚠️ The host's adapter has been silent for three minutes. The host is on hold: people get a fixed reply, and their messages wait."
alert_host_exited = "⚠️ The host's gateway stopped by itself. Core starts it again; until it passes its check, people get a fixed reply and their messages wait."
alert_host_conflict = "⚠️ Two clients poll the gatekeeper at once. Only one host gateway may run: look for a second one."
alert_host_not_polling = "⚠️ The host has not asked the gatekeeper for messages for five minutes, although its adapter is alive."
alert_host_send_failed = "⚠️ Telegram refused an answer from the host ({error}). The person was asked to send their message again."
alert_host_send_refused = "⚠️ The gatekeeper did not take an answer of the host ({reason}). The person may have got no answer."
alert_host_turn_failed = "⚠️ A person's message got no answer: the model failed ({reason}). If the reason is auth, the model's token stopped working: run klepa-core host login."
alert_host_model_auth = "⚠️ The model refused its token: people get a fixed reply until it works again. Run klepa-core host login with a new setup-token; if the host stopped, press Resume."
alert_host_model_unavailable = "⚠️ The model did not answer the start check ({reason}). The host runs anyway: people get an apology for each message until the model answers again."
alert_egress_failed = "⚠️ The egress proxy does not start ({error}). The host cannot reach the model."
